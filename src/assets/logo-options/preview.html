<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HELIOS Logo Options</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(180deg, #f7fbff, #eef5ff);
        color: #071225;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 40px;
        line-height: 1;
      }
      p {
        margin: 0 0 28px;
        color: #526178;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .card {
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        padding: 18px;
        box-shadow: 0 22px 56px rgba(32, 50, 92, 0.10);
      }
      .card strong {
        display: block;
        margin-bottom: 12px;
        color: #0f62fe;
        font-size: 13px;
        text-transform: uppercase;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      .nav-preview {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 14px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: white;
        padding: 12px 16px;
      }
      .nav-preview img {
        width: 170px;
      }
      .nav-preview span {
        border-left: 1px solid #e2e8f0;
        padding-left: 14px;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HELIOS Logo Options</h1>
      <p>Current Cohere-inspired redesign에 맞춰 만든 SVG 후보입니다.</p>
      <div class="grid">
        <section class="card">
          <strong>A. Orbit</strong>
          <img src="./helios-logo-orbit.svg" alt="HELIOS Orbit logo" />
          <div class="nav-preview"><img src="./helios-logo-orbit.svg" alt="" /><span>Clinical FL Console</span></div>
        </section>
        <section class="card">
          <strong>B. Pulse</strong>
          <img src="./helios-logo-pulse.svg" alt="HELIOS Pulse logo" />
          <div class="nav-preview"><img src="./helios-logo-pulse.svg" alt="" /><span>Clinical FL Console</span></div>
        </section>
        <section class="card">
          <strong>C. Node</strong>
          <img src="./helios-logo-node.svg" alt="HELIOS Node logo" />
          <div class="nav-preview"><img src="./helios-logo-node.svg" alt="" /><span>Clinical FL Console</span></div>
        </section>
        <section class="card">
          <strong>D. H Mark</strong>
          <img src="./helios-logo-hmark.svg" alt="HELIOS H mark logo" />
          <div class="nav-preview"><img src="./helios-logo-hmark.svg" alt="" /><span>Clinical FL Console</span></div>
        </section>
      </div>
    </main>
  </body>
</html>
